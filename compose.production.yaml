services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: restaurant
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant"]
      interval: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://restaurant:${DB_PASSWORD}@db:5432/restaurant
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST required}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy:/data", "caddy_config:/config"]
    depends_on: [app]
    restart: unless-stopped
volumes:
  database:
  caddy:
  caddy_config:
