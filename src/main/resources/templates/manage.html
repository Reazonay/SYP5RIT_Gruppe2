<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
 <head th:replace="~{fragments :: head('Verwaltung')}">
 </head>
 <body>
  <header th:replace="~{fragments :: header}">
  </header>
  <main class="manage-page dashboard-shell">
   <nav th:replace="~{fragments :: staffNav}">
   </nav>
   <div th:replace="~{fragments :: messages}">
   </div>
   <div class="dashboard-header">
    <div>
     <span class="workspace-kicker">
      Restaurant-Steuerung
     </span>
     <h1>
      Verwaltung
     </h1>
    </div>
   </div>
   <div class="admin-grid">
    <section class="dashboard-panel">
     <div class="panel-bar">
      <h2>
       Speisekarte verwalten
      </h2>
      <span class="count-pill" th:text="${menu.size() + ' Einträge'}">
      </span>
     </div>
     <div class="catalog-list">
      <form class="catalog-item" method="post" th:action="@{/staff/manage/menu/{id}(id=${item.id})}" th:each="item : ${menu}">
       <div class="row">
        <label>
         Name
         <input maxlength="120" name="name" required="" th:value="${item.name}"/>
        </label>
        <label class="price-field">
         Preis in Euro
         <input max="1000" min="0" name="price" required="" step=".01" th:value="${@format.decimal(item.price)}" type="number"/>
        </label>
        <label class="category-field">
         Art
         <select name="category">
          <option th:selected="${item.category == 'food'}" value="food">
           Speise
          </option>
          <option th:selected="${item.category == 'drink'}" value="drink">
           Getränk
          </option>
         </select>
        </label>
       </div>
       <div class="catalog-actions">
        <label class="checkbox-field">
         <input name="available" th:checked="${item.available}" type="checkbox" value="true"/>
         Verfügbar
        </label>
        <button class="compact">
         Änderungen speichern
        </button>
       </div>
      </form>
     </div>
     <div class="composer-box">
      <h3>
       Artikel hinzufügen
      </h3>
      <form method="post" th:action="@{/staff/manage/menu}">
       <div class="row">
        <label>
         Name
         <input maxlength="120" name="name" placeholder="z. B. Saisonales Risotto" required=""/>
        </label>
        <label class="price-field">
         Preis in Euro
         <input max="1000" min="0" name="price" placeholder="14.90" required="" step=".01" type="number"/>
        </label>
        <label class="category-field">
         Art
         <select name="category">
          <option value="food">
           Speise
          </option>
          <option value="drink">
           Getränk
          </option>
         </select>
        </label>
       </div>
       <button class="primary">
        Artikel hinzufügen
       </button>
      </form>
     </div>
    </section>
    <section class="dashboard-panel">
     <div class="panel-bar">
      <h2>
       Plätze verwalten
      </h2>
      <span class="count-pill" th:text="${seats.size() + ' Plätze'}">
      </span>
     </div>
     <div class="composer-box">
      <h3>
       Neuen Sitzplatz anlegen
      </h3>
      <form method="post" th:action="@{/staff/manage/seats}">
       <div class="row">
        <label>
         Platzbezeichnung
         <input maxlength="80" name="label" placeholder="z. B. Platz 31" required=""/>
        </label>
        <label>
         Tisch
         <input maxlength="80" name="tableName" placeholder="z. B. Tisch 4" required=""/>
        </label>
       </div>
       <button class="primary">
        Platz hinzufügen
       </button>
      </form>
     </div>
     <ul class="seat-admin-list">
      <li th:classappend="${!seat.active ? 'is-inactive' : ''}" th:each="seat : ${seats}">
       <div class="seat-admin-meta">
        <strong th:text="${seat.label}">
        </strong>
        <span th:text="${' · ' + seat.table_name}">
        </span>
       </div>
       <form class="inline" method="post" th:action="@{/staff/manage/seats/{id}(id=${seat.id})}">
        <input name="active" th:value="${!seat.active}" type="hidden"/>
        <button class="compact" th:classappend="${!seat.active ? 'primary' : ''}" th:text="${seat.active ? 'Deaktivieren' : 'Aktivieren'}">
        </button>
       </form>
      </li>
     </ul>
    </section>
   </div>
  </main>
  <footer th:replace="~{fragments :: footer}">
  </footer>
 </body>
</html>
