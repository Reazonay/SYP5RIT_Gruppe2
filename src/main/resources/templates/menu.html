<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
 <head th:replace="~{fragments :: head('Speisekarte')}">
 </head>
 <body>
  <header th:replace="~{fragments :: header}">
  </header>
  <main class="menu-page">
   <div th:replace="~{fragments :: messages}">
   </div>
   <div class="menu-hero">
    <div>
     <span class="workspace-kicker">
      GourmetGrove Auswahl
     </span>
     <h1>
      Speise- und Getränkekarte
     </h1>
     <p th:if="${visit != null &amp;&amp; ordering}">
      <svg th:replace="~{fragments :: icon('table')}">
      </svg>
      <span th:text="${visit.seat_label}">
      </span>
      · Direkt auf Ihren Tisch bestellen
     </p>
     <p th:unless="${ordering}">
      Frisch zubereitete Küche und ausgewählte Getränke vor Ort.
     </p>
    </div>
    <a class="button primary" href="/" th:unless="${ordering}">
     <svg th:replace="~{fragments :: icon('calendar')}">
     </svg>
     Tisch reservieren
    </a>
   </div>
   <section th:replace="~{fragments :: menu(${ordering},'/visit')}">
   </section>
   <div class="menu-summary" th:if="${visit != null}">
    <div>
     <span>
      Aktuelle Tischbestellung
     </span>
     <strong th:text="${@format.money(visit.subtotal)}">
     </strong>
    </div>
    <a class="button primary" href="/visit">
     Zum Besuch
     <svg th:replace="~{fragments :: icon('arrow')}">
     </svg>
    </a>
   </div>
   <p class="help-text" th:unless="${ordering}">
    Zum Vor- oder Nachbestellen öffnen Sie Ihren persönlichen Reservierungslink unter „Mein Besuch“.
   </p>
  </main>
  <footer th:replace="~{fragments :: footer}">
  </footer>
 </body>
</html>
