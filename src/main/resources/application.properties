server.port=${PORT:3000}
spring.application.name=restaurant-api
spring.config.import=optional:file:.env[.properties]
app.database-url=${DATABASE_URL:postgres://restaurant:restaurant@localhost:5432/restaurant}
app.public-url=${PUBLIC_URL:http://localhost:3000}
app.production=${APP_PRODUCTION:false}
app.seed=${APP_SEED:false}
app.seed-password=${SEED_PASSWORD:}
app.jobs.enabled=${APP_JOBS_ENABLED:true}
app.stripe-secret-key=${STRIPE_SECRET_KEY:}
app.paypal-client-id=${PAYPAL_CLIENT_ID:}
app.paypal-client-secret=${PAYPAL_CLIENT_SECRET:}
spring.flyway.baseline-version=1
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.properties.mail.smtp.starttls.enable=${app.production}
spring.mail.properties.mail.smtp.starttls.required=${app.production}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
app.smtp-from=${SMTP_FROM:restaurant@example.test}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.web.resources.static-locations=classpath:/static/
server.error.include-message=never
server.shutdown=graceful
spring.servlet.multipart.max-request-size=100KB

spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=8h
app.zone-id=${APP_ZONE_ID:Europe/Vienna}
server.servlet.session.cookie.secure=${app.production}
