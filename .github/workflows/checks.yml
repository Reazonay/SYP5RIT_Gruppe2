name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: restaurant
          POSTGRES_PASSWORD: restaurant
          POSTGRES_DB: restaurant_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U restaurant" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://restaurant:restaurant@localhost:5432/restaurant_test
      PUBLIC_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:tests -w apps/api
      - run: npm run migrate -w apps/api
      - run: npm test
        env:
          RUN_DATABASE_TESTS: '1'
      - run: createdb -h localhost -U restaurant restaurant_browser
        env:
          PGPASSWORD: restaurant
      - run: npm run migrate -w apps/api
        env:
          DATABASE_URL: postgres://restaurant:restaurant@localhost:5432/restaurant_browser
      - run: npm run seed -w apps/api
        env:
          SEED_PASSWORD: browser-test-password-only
          DATABASE_URL: postgres://restaurant:restaurant@localhost:5432/restaurant_browser
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          SEED_PASSWORD: browser-test-password-only
          DATABASE_URL: postgres://restaurant:restaurant@localhost:5432/restaurant_browser
