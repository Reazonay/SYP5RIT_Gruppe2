name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: restaurant
          POSTGRES_PASSWORD: restaurant
          POSTGRES_DB: restaurant_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U restaurant" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://restaurant:restaurant@localhost:5432/restaurant_test
      PUBLIC_URL: http://localhost:3000
      APP_JOBS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: .cache/maven
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
      - run: bash scripts/mvn.sh -DskipTests package
      - run: bash scripts/mvn.sh spotless:check
      - run: bash scripts/mvn.sh test
        env:
          RUN_DATABASE_TESTS: '1'
      - run: createdb -h localhost -U restaurant restaurant_browser
        env:
          PGPASSWORD: restaurant
      - run: bash scripts/api-command.sh seed
        env:
          SEED_PASSWORD: browser-test-password-only
          DATABASE_URL: postgres://restaurant:restaurant@localhost:5432/restaurant_browser
      - run: bash scripts/mvn.sh -q test-compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.classpathScope=test '-Dexec.args=install --with-deps chromium'
      - name: Browser tests
        env:
          DATABASE_URL: postgres://restaurant:restaurant@localhost:5432/restaurant_browser
          SEED_PASSWORD: browser-test-password-only
        run: |
          java -jar target/restaurant.jar > /tmp/restaurant.log 2>&1 &
          for attempt in {1..100}; do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          RUN_BROWSER_TESTS=1 bash scripts/mvn.sh -Dtest=BrowserTest test
